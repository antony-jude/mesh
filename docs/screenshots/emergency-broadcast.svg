<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#061b2b"/>
  <rect x="40" y="20" width="1120" height="860" rx="30" fill="#0a1d2f" stroke="#214a69"/>
  <text x="90" y="95" fill="#dce8f8" font-size="30" font-family="Segoe UI, Arial">Emergency Mesh Broadcast</text>
  <rect x="80" y="140" width="1040" height="120" rx="18" fill="#3b1a1d" stroke="#ff6b6b"/>
  <text x="120" y="190" fill="#fff" font-size="28" font-family="Segoe UI, Arial" font-weight="700">HIGH PRIORITY FLOOD BROADCAST</text>
  <text x="120" y="228" fill="#ffd7d7" font-size="20" font-family="Segoe UI, Arial">This message will flood all nearby nodes and relay through multiple hops.</text>

  <text x="90" y="322" fill="#dce8f8" font-size="26" font-family="Segoe UI, Arial" font-weight="700">SELECT EMERGENCY TEMPLATE</text>

  <rect x="90" y="350" width="1020" height="110" rx="18" fill="#2c0d10" stroke="#ff6b6b"/>
  <circle cx="170" cy="405" r="28" fill="#ff6b6b"/>
  <text x="220" y="400" fill="#fff" font-size="30" font-family="Segoe UI, Arial" font-weight="700">CRITICAL MEDICAL ASSISTANCE</text>
  <text x="220" y="436" fill="#ffd4d4" font-size="20" font-family="Segoe UI, Arial">Injured survivor requiring urgent medical stabilization and extraction.</text>
  <circle cx="1060" cy="405" r="18" fill="#35d29a"/>

  <rect x="90" y="490" width="1020" height="110" rx="18" fill="#162b45" stroke="#5b9bd1"/>
  <circle cx="170" cy="545" r="28" fill="#f4b942"/>
  <text x="220" y="535" fill="#dfefff" font-size="30" font-family="Segoe UI, Arial" font-weight="700">FOOD &amp; CLEAN WATER SUPPLY</text>
  <text x="220" y="570" fill="#cfe3f7" font-size="20" font-family="Segoe UI, Arial">Immediate need for potable water and emergency rations.</text>

  <rect x="90" y="630" width="1020" height="110" rx="18" fill="#162b45" stroke="#5b9bd1"/>
  <circle cx="170" cy="685" r="28" fill="#f4b942"/>
  <text x="220" y="675" fill="#dfefff" font-size="30" font-family="Segoe UI, Arial" font-weight="700">IMMEDIATE EVACUATION REQUIRED</text>
  <text x="220" y="710" fill="#cfe3f7" font-size="20" font-family="Segoe UI, Arial">Structural collapse / rising hazard. Need immediate evacuation corridor.</text>

  <rect x="90" y="770" width="860" height="60" rx="12" fill="#0d1f2d" stroke="#5a90b4"/>
  <text x="120" y="809" fill="#dce8f8" font-size="24" font-family="Segoe UI, Arial">Include GPS Coordinates</text>
  <rect x="970" y="780" width="110" height="42" rx="21" fill="#35d29a"/>
</svg>
