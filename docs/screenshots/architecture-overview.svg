  <rect x="1040" y="130" width="330" height="280" rx="20" fill="#fff5eb" stroke="#d97706"/>
  <text x="1090" y="170" fill="#7c3f00" font-size="25" font-family="Segoe UI, Arial" font-weight="700">3. CLOUD GATEWAY SYNC</text>
  <text x="1090" y="220" fill="#7c3f00" font-size="18">Gateway role detection</text>
  <text x="1090" y="250" fill="#7c3f00" font-size="18">Offline packet buffer</text>
  <text x="1090" y="280" fill="#7c3f00" font-size="18">Sync service</text>
  <text x="1090" y="310" fill="#7c3f00" font-size="18">Firebase / Firestore</text>
  <text x="1090" y="340" fill="#7c3f00" font-size="18">Secure push / alerting</text>

  <rect x="28" y="470" width="360" height="330" rx="20" fill="#f3f5ff" stroke="#4b4ed6"/>
  <text x="72" y="515" fill="#1c2368" font-size="24" font-family="Segoe UI, Arial" font-weight="700">A. DATA &amp; SECURITY LAYER</text>
  <text x="72" y="560" fill="#1c2368" font-size="18">AES-256 encrypted packets</text>
  <text x="72" y="595" fill="#1c2368" font-size="18">SHA-256 HMAC integrity</text>
