  <rect x="350" y="210" width="130" height="90" rx="12" fill="#ffffff" stroke="#2c7ecd"/>
  <text x="382" y="246" fill="#0a3d66" font-size="18">Node A</text>
  <text x="373" y="272" fill="#0a3d66" font-size="16">Victim</text>
  <rect x="520" y="210" width="130" height="90" rx="12" fill="#ffffff" stroke="#2c7ecd"/>
  <text x="552" y="246" fill="#0a3d66" font-size="18">Node B</text>
  <text x="543" y="272" fill="#0a3d66" font-size="16">Relay</text>
  <rect x="690" y="210" width="130" height="90" rx="12" fill="#ffffff" stroke="#2c7ecd"/>
  <text x="722" y="246" fill="#0a3d66" font-size="18">Node C</text>
  <text x="713" y="272" fill="#0a3d66" font-size="16">Relay</text>
  <rect x="860" y="210" width="130" height="90" rx="12" fill="#ffffff" stroke="#2c7ecd"/>
  <text x="889" y="246" fill="#0a3d66" font-size="18">Node D</text>
