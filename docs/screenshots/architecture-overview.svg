  <text x="1135" y="560" fill="#3d1a7a" font-size="18">Shortest safe path</text>
  <text x="1135" y="595" fill="#3d1a7a" font-size="18">Hazard penalty model</text>
  <text x="1135" y="630" fill="#3d1a7a" font-size="18">Risk-aware route</text>
  <text x="1135" y="665" fill="#3d1a7a" font-size="18">Resource allocation</text>
  <text x="1135" y="700" fill="#3d1a7a" font-size="18">Responder guidance</text>
