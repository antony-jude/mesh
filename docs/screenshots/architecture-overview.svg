  <text x="850" y="595" fill="#855800" font-size="18">Mesh topology graph</text>
  <text x="850" y="630" fill="#855800" font-size="18">Gemini rationale view</text>
  <text x="850" y="665" fill="#855800" font-size="18">Hazard-aware routing</text>
