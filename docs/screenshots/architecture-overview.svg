  <text x="490" y="595" fill="#145732" font-size="18">TTL management</text>
  <text x="490" y="630" fill="#145732" font-size="18">Message deduplication</text>
  <text x="490" y="665" fill="#145732" font-size="18">Link quality monitoring</text>
  <text x="490" y="700" fill="#145732" font-size="18">Fault tolerance / retries</text>

  <rect x="820" y="470" width="260" height="330" rx="20" fill="#fffaf0" stroke="#d88a00"/>
