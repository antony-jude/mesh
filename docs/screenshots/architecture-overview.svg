<svg width="1400" height="880" viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="880" fill="#eef4fb"/>
  <text x="500" y="60" fill="#0a2338" font-size="38" font-family="Segoe UI, Arial" font-weight="700">ResQ-Mesh (MeshLink) – System Architecture</text>
  <text x="470" y="95" fill="#375a77" font-size="22" font-family="Segoe UI, Arial">Zero-Infrastructure Off-Grid Emergency Communication &amp; Multimodal Disaster Triage</text>

  <rect x="28" y="130" width="250" height="280" rx="20" fill="#e9f7f0" stroke="#2f9e8a"/>
  <text x="70" y="170" fill="#0b3b2e" font-size="25" font-family="Segoe UI, Arial" font-weight="700">1. EDGE SENSING &amp; TRIAGE</text>
  <text x="60" y="215" fill="#0b3b2e" font-size="18">Passive Audio</text>
  <text x="60" y="245" fill="#0b3b2e" font-size="18">YAMNet filter</text>
  <text x="60" y="275" fill="#0b3b2e" font-size="18">Silent SOS detector</text>
  <text x="60" y="305" fill="#0b3b2e" font-size="18">Gemini Nano / TF Lite</text>
  <text x="60" y="335" fill="#0b3b2e" font-size="18">Priority score + context</text>

  <rect x="320" y="130" width="650" height="280" rx="20" fill="#eaf7ff" stroke="#2c7ecd"/>
