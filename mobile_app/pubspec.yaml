name: meshlink
description: "MeshLink — Offline Store-and-Forward P2P Mesh Communication Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0
  
  # Cryptography (AES-256 & SHA-256 HMAC)
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Typography & Design
  google_fonts: ^6.2.1
  sensors_plus: ^7.1.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
